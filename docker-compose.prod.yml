# Stack de redéploiement "sans code source local" : aucune clé `build:`,
# uniquement des `image:` pointant vers des tags publiés sur le registry.
# Usage :
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Un simple `git clone` du dépôt (ou même juste ce fichier + .env) suffit :
# aucun accès au dossier api/ ou stats-service/ n'est nécessaire.

services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - - db_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USER}/todo-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    ports:
      - "${API_PORT:-3000}:3000"

  stats:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USER}/todo-stats:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    ports:
      - "${STATS_PORT:-5000}:5000"

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
  db_data:
