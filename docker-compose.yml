# Stack de développement : build local des images à partir du code source.
# Démarrage en une commande : docker compose up -d --build
#
# Pas de clé `version:` : dépréciée par le Compose Specification, ignorée
# (et source d'un warning) par les versions récentes de docker compose.

services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    # Pas de `ports:` ici : la base n'est joignable que par les autres
    # conteneurs du réseau `backend`, jamais depuis la machine hôte.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ${API_IMAGE:-todo-api}:${API_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  stats:
    build:
      context: ./stats-service
      dockerfile: Dockerfile
    image: ${STATS_IMAGE:-todo-stats}:${STATS_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    ports:
      - "${STATS_PORT:-5000}:5000"

networks:
  # Réseau interne : pas de route vers l'extérieur, la base y est isolée.
  backend:
    driver: bridge
    internal: true
  # Réseau "public" : seul celui-ci permet aux ports publiés (ports:)
  # d'être réellement joignables depuis l'hôte.
  frontend:
    driver: bridge

volumes:
  db_data:
